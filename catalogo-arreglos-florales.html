    body, p, a, span, li, button {

    }
    .btn-accion {
      display: inline-block;
      padding: 12px 24px;
      background-color: #2c2c2c;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.25s ease;

    .btn-accion:hover {
      background-color: #4f4f4f;

    .btn-secundario {
      background-color: transparent;
